<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knowledge Check — Data Integrations &amp; Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f8fafc; color: #2d3748; padding-bottom: 48px; }
  .header { background: #1a1a2e; padding: 18px 28px; display: flex; align-items: center; gap: 12px; }
  .badge { background: #1A6AFF; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 4px; }
  .header-title { color: #fff; font-size: 15px; font-weight: 700; }
  .header-sub { color: #94a3b8; font-size: 13px; margin-left: auto; }
  .progress-bar-wrap { background: #e2e8f0; height: 4px; }
  .progress-bar-fill { background: #1A6AFF; height: 4px; transition: width 0.4s ease; }
  .container { max-width: 700px; margin: 0 auto; padding: 40px 24px 0; }
  .q-counter { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
  .scenario-label { font-size: 11px; font-weight: 700; color: #1A6AFF; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
  .question-text { font-size: 20px; font-weight: 700; color: #1a1a2e; line-height: 1.4; margin-bottom: 10px; }
  .scenario-context { background: #eff6ff; border-left: 3px solid #1A6AFF; border-radius: 0 6px 6px 0; padding: 12px 16px; font-size: 14px; color: #1e40af; line-height: 1.6; margin-bottom: 28px; }
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .option { background: #fff; border: 2px solid #e2e8f0; border-radius: 10px; padding: 16px 20px; font-size: 15px; color: #2d3748; cursor: pointer; display: flex; align-items: flex-start; gap: 14px; transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%; line-height: 1.5; font-family: inherit; }
  .option:hover:not(:disabled) { border-color: #1A6AFF; background: #f0f7ff; }
  .option:disabled { cursor: default; }
  .option-letter { background: #f1f5f9; color: #64748b; font-size: 12px; font-weight: 700; border-radius: 50%; min-width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .option.correct { border-color: #16a34a; background: #f0fdf4; }
  .option.correct .option-letter { background: #16a34a; color: #fff; }
  .option.wrong { border-color: #dc2626; background: #fef2f2; }
  .option.wrong .option-letter { background: #dc2626; color: #fff; }
  .option.dimmed { opacity: 0.4; }
  .feedback-box { border-radius: 10px; padding: 18px 20px; font-size: 14px; line-height: 1.6; margin-bottom: 24px; display: none; }
  .feedback-box.correct { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  .feedback-box.wrong { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .feedback-title { font-weight: 700; margin-bottom: 4px; font-size: 15px; }
  .btn { background: #1A6AFF; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; display: none; }
  .btn:hover { background: #1558e0; }
  .score-screen { display: none; text-align: center; padding: 20px 0; }
  .score-circle { width: 110px; height: 110px; border-radius: 50%; background: #1A6AFF; color: #fff; font-size: 36px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
  .score-title { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
  .score-sub { font-size: 16px; color: #4a5568; margin-bottom: 32px; line-height: 1.6; }
  .score-breakdown { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 28px; text-align: left; }
  .breakdown-row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-label { flex: 1; color: #2d3748; line-height: 1.4; }
  .retry-btn { background: #f1f5f9; color: #1a1a2e; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .retry-btn:hover { background: #e2e8f0; }
</style>
</head>
<body>

<div class="header">
  <span class="badge">Administrator</span>
  <span class="header-title">Data Integrations &amp; Hub — Knowledge Check</span>
  <span class="header-sub" id="header-counter">Question 1 of 8</span>
</div>
<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>

<div class="container">
  <div id="quiz-area">
    <div class="q-counter" id="q-counter">Question 1 of 8</div>
    <div class="scenario-label" id="scenario-label"></div>
    <div class="question-text" id="question-text"></div>
    <div class="scenario-context" id="scenario-context"></div>
    <div class="options" id="options-list"></div>
    <div class="feedback-box" id="feedback-box"><div class="feedback-title" id="feedback-title"></div><div id="feedback-body"></div></div>
    <button class="btn" id="next-btn" onclick="nextQuestion()">Next question →</button>
  </div>
  <div class="score-screen" id="score-screen">
    <div class="score-circle" id="score-circle"></div>
    <div class="score-title" id="score-title"></div>
    <div class="score-sub" id="score-sub"></div>
    <div class="score-breakdown" id="score-breakdown"></div>
    <button class="retry-btn" onclick="restart()">Try again</button>
  </div>
</div>

<script>
const questions = [
  {
    scenario: "Scenario 1 — Choosing an Integration",
    question: "Your registrar wants to send GPA and cost of attendance data every term, but there's no standard field in Compliance and Recruiting for one of the data points. Which integration should you use?",
    context: "You need a flexible import that can also carry non-standard data points using custom fields.",
    options: [
      "Financial Aid Data Integration",
      "Demographic Data Integration",
      "Admissions Integration",
      "Student Athlete Export Integration"
    ],
    correct: 1,
    feedback_correct: "Correct. The Demographic Data Integration is the free-form catch-all import — university ID is required, term code only for GPA or term-specific data, and anything without a standard field can be stored in a custom field.",
    feedback_wrong: "Not quite. The Demographic Data Integration is the customizable catch-all designed for exactly this kind of data, including anything that needs a custom field."
  },
  {
    scenario: "Scenario 2 — Financial Aid Setup",
    question: "Your compliance office wants financial aid awards tied to sports without relying on the default hierarchy. What do you need to send?",
    context: "You're prepping the financial aid import and want full control over how awards map to sports.",
    options: [
      "Nothing extra — awards always follow the athlete's roster sport automatically",
      "A sport column in the awards file, plus a sport translation file",
      "A CIP code for each award",
      "An admissions ID for each award"
    ],
    correct: 1,
    feedback_correct: "Correct. Sending a sport column along with a matching sport translation file overrides the default Division I sport hierarchy.",
    feedback_wrong: "Not quite. You'll need a sport column in the awards file plus a sport translation file to override the default Division I hierarchy."
  },
  {
    scenario: "Scenario 3 — PTD & NCAA Reporting",
    question: "Compliance flags that a degree record in your PTD import can't be reported correctly for NCAA purposes. What's most likely missing?",
    context: "Every degree tracked for Progress Towards Degree needs a specific code for NCAA reporting.",
    options: [
      "Fund code",
      "CIP code",
      "Term code",
      "Admissions ID"
    ],
    correct: 1,
    feedback_correct: "Correct. Each degree's CIP code is required for PTD tracking and is what NCAA reporting relies on.",
    feedback_wrong: "Not quite. The CIP code tied to each degree is what's required for PTD tracking and NCAA reporting."
  },
  {
    scenario: "Scenario 4 — Admissions File Cleanup",
    question: "A recruit who was archived months ago just reappeared as active in Compliance and Recruiting. What likely happened?",
    context: "Coaches use the archive feature in Compliance and Recruiting to hide prospects they're no longer recruiting.",
    options: [
      "The admissions platform's file included that archived prospect again",
      "The recruit re-submitted the online questionnaire",
      "The nightly staff export ran again",
      "The prospect's term code changed"
    ],
    correct: 0,
    feedback_correct: "Correct. Including archived prospects in the file sent from your admissions platform will reactivate their Compliance and Recruiting profile — that's why archived prospects should be excluded.",
    feedback_wrong: "Not quite. Including archived prospects in the admissions file reactivates their profile, which is why they should be excluded from the file."
  },
  {
    scenario: "Scenario 5 — SFTP Setup",
    question: "Campus IT is setting up your SFTP connection for a new data integration and asks what key requirements to follow. What do you tell them?",
    context: "You're kicking off a new integration project and IT needs to generate the right kind of key.",
    options: [
      "Any key format works, with no minimum size",
      "A public SSH key, 2048-bit minimum, in RSA or SSH2 format",
      "A 4096-bit PGP key",
      "A username-only connection — no key needed"
    ],
    correct: 1,
    feedback_correct: "Correct. The public key must be at least 2048-bit encryption in RSA or SSH2 format, and the private key stays on your end.",
    feedback_wrong: "Not quite. IT needs to generate a public SSH key that's at least 2048-bit, in RSA or SSH2 format, and keep the private key on file."
  },
  {
    scenario: "Scenario 6 — Onboarding a New Staff Member",
    question: "You're adding a new compliance staff member who also needs a Teamworks Hub login. What's the fastest way to set this up?",
    context: "You want to avoid creating two separate accounts through two separate processes.",
    options: [
      "Create the Compliance and Recruiting account first, then separately create their Hub profile in Hub",
      "Use Settings > Security > Users > Add User, and select Yes for Add User Teamworks Hub",
      "Ask the new staff member to self-register in Hub",
      "Wait until their first roster change to add them to Hub"
    ],
    correct: 1,
    feedback_correct: "Correct. The Add User flow lets you create the Compliance and Recruiting account and the Hub profile — team and user type included — in one step.",
    feedback_wrong: "Not quite. Settings > Security > Users > Add User, with Yes selected for Add User Teamworks Hub, creates both accounts at once."
  },
  {
    scenario: "Scenario 7 — Hub-Synced Event Conflict",
    question: "A coach says the wrong start time is showing on a practice event, but you can't edit it directly in Compliance and Recruiting. Why not, and what should you do?",
    context: "The event shows a banner icon indicating it was synced over from Teamworks Hub.",
    options: [
      "Delete the event and recreate it manually",
      "Event type, date/time, and attendees are locked on Hub-synced events — select Re-sync Event with Hub to pull the latest details",
      "Contact the NCAA to update the event",
      "Wait 24 hours for it to auto-correct"
    ],
    correct: 1,
    feedback_correct: "Correct. Those fields are locked once an event syncs from Hub. Re-sync Event with Hub manually pulls in the latest attendees and event details instead.",
    feedback_wrong: "Not quite. Event type, date/time, and attendees can't be edited on synced events — use Re-sync Event with Hub to pull the latest details."
  },
  {
    scenario: "Scenario 8 — Calendar Type Mapping",
    question: "A new Hub calendar event type isn't showing up on your compliance calendars. Where do you go to fix this?",
    context: "Hub event types need to be matched to Compliance and Recruiting event types before they'll sync over.",
    options: [
      "Settings > Security > Users",
      "Team module > Playing Season Calendar",
      "Settings > Time Management > CARE Calendar Syncing",
      "The event's History tab"
    ],
    correct: 2,
    feedback_correct: "Correct. Edit Mappings under Settings > Time Management > CARE Calendar Syncing lets you map each Hub event type to a Compliance and Recruiting event type, then set the sync date range and refresh.",
    feedback_wrong: "Not quite. That mapping lives in Settings > Time Management > CARE Calendar Syncing, via the Edit Mappings modal."
  }
];

let current = 0, score = 0, answered = false, results = [];

function render() {
  const q = questions[current];
  document.getElementById('scenario-label').textContent = q.scenario;
  document.getElementById('question-text').textContent = q.question;
  document.getElementById('scenario-context').textContent = q.context;
  document.getElementById('q-counter').textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById('header-counter').textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById('progress-bar').style.width = `${(current/questions.length)*100}%`;
  const list = document.getElementById('options-list');
  list.innerHTML = '';
  ['A','B','C','D'].forEach((l, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-letter">${l}</span><span>${q.options[i]}</span>`;
    btn.onclick = () => select(i, btn);
    list.appendChild(btn);
  });
  const fb = document.getElementById('feedback-box');
  fb.style.display = 'none'; fb.className = 'feedback-box';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
}

function select(idx, btn) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const options = document.querySelectorAll('.option');
  const isCorrect = idx === q.correct;
  if (isCorrect) score++;
  results.push({ label: q.scenario, correct: isCorrect });
  options.forEach((el, i) => {
    el.disabled = true;
    if (i === q.correct) { el.classList.add('correct'); el.querySelector('.option-letter').style.cssText = 'background:#16a34a;color:#fff'; }
    else if (i === idx && !isCorrect) { el.classList.add('wrong'); el.querySelector('.option-letter').style.cssText = 'background:#dc2626;color:#fff'; }
    else el.classList.add('dimmed');
  });
  const fb = document.getElementById('feedback-box');
  fb.style.display = 'block';
  fb.className = 'feedback-box ' + (isCorrect ? 'correct' : 'wrong');
  document.getElementById('feedback-title').textContent = isCorrect ? '✓ Correct' : '✗ Not quite';
  document.getElementById('feedback-body').textContent = isCorrect ? q.feedback_correct : q.feedback_wrong;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = current < questions.length - 1 ? 'Next question →' : 'See my results →';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) { showScore(); return; }
  render();
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('header-counter').textContent = 'Complete';
  const pct = Math.round((score/questions.length)*100);
  document.getElementById('score-circle').textContent = `${pct}%`;
  document.getElementById('score-title').textContent = pct === 100 ? 'Perfect score!' : pct >= 75 ? 'Strong work!' : 'Keep practicing';
  document.getElementById('score-sub').textContent = `You answered ${score} of ${questions.length} scenarios correctly. ` + (pct === 100 ? 'You\'re ready to manage data integrations and Hub sync points with confidence.' : 'Review the scenarios you missed and try again when you\'re ready.');
  document.getElementById('score-breakdown').innerHTML = results.map(r =>
    `<div class="breakdown-row"><span style="font-size:16px;flex-shrink:0;">${r.correct ? '✅' : '❌'}</span><span class="breakdown-label">${r.label}</span></div>`
  ).join('');
}

function restart() {
  current = 0; score = 0; answered = false; results = [];
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('score-screen').style.display = 'none';
  render();
}

render();
</script>
</body>
</html>
