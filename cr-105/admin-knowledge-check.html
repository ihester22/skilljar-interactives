<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Matching Activity — Recruiting &amp; Complimentary Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f8fafc; color: #2d3748; padding-bottom: 48px; }
  .header { background: #1a1a2e; padding: 18px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .badge { background: #1A6AFF; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 4px; }
  .header-title { color: #fff; font-size: 15px; font-weight: 700; }
  .header-sub { color: #94a3b8; font-size: 13px; margin-left: auto; }
  .progress-bar-wrap { background: #e2e8f0; height: 4px; }
  .progress-bar-fill { background: #1A6AFF; height: 4px; transition: width 0.4s ease; }
  .container { max-width: 780px; margin: 0 auto; padding: 32px 24px 0; }
  .intro-label { font-size: 11px; font-weight: 700; color: #1A6AFF; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
  .intro-text { font-size: 15px; color: #4a5568; line-height: 1.6; margin-bottom: 24px; }
  .mistakes-counter { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin-bottom: 24px; }
  .col-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .card { background: #fff; border: 2px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; font-size: 14px; color: #2d3748; cursor: pointer; text-align: left; width: 100%; line-height: 1.45; font-family: inherit; transition: border-color 0.15s, background 0.15s, transform 0.1s; }
  .card:hover:not(:disabled) { border-color: #1A6AFF; background: #f0f7ff; }
  .card:disabled { cursor: default; }
  .term-card { font-weight: 700; color: #1a1a2e; }
  .card.selected { border-color: #1A6AFF; background: #eff6ff; box-shadow: 0 0 0 3px rgba(26,106,255,0.15); }
  .card.matched { border-color: #16a34a; background: #f0fdf4; color: #166534; opacity: 0.85; }
  .card.wrong { border-color: #dc2626; background: #fef2f2; }
  .btn { background: #1A6AFF; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .btn:hover { background: #1558e0; }
  .score-screen { display: none; text-align: center; padding: 20px 0; }
  .score-circle { width: 110px; height: 110px; border-radius: 50%; background: #1A6AFF; color: #fff; font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; text-align: center; line-height: 1.1; }
  .score-title { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
  .score-sub { font-size: 16px; color: #4a5568; margin-bottom: 32px; line-height: 1.6; }
  .score-breakdown { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 28px; text-align: left; }
  .breakdown-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #f1f5f9; font-size: 14px; line-height: 1.5; }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-term { font-weight: 700; color: #1a1a2e; flex-shrink: 0; min-width: 190px; }
  .breakdown-def { color: #4a5568; }
  .retry-btn { background: #f1f5f9; color: #1a1a2e; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .retry-btn:hover { background: #e2e8f0; }
  @media (max-width: 640px) {
    .board { grid-template-columns: 1fr; }
    .breakdown-term { min-width: 0; }
    .breakdown-row { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>

<div class="header">
  <span class="badge">Administrator</span>
  <span class="header-title">Recruiting &amp; Complimentary Tickets — Matching Activity</span>
  <span class="header-sub" id="header-counter">0 of 6 matched</span>
</div>
<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>

<div class="container">
  <div id="game-area">
    <div class="intro-label">Match Each Term</div>
    <div class="intro-text">Select a term on the left, then select the definition on the right that matches it. Matched pairs lock in green — mismatches bounce back so you can try again.</div>
    <div class="mistakes-counter" id="mistakes-counter">Mistakes: 0</div>
    <div class="board">
      <div>
        <div class="col-label">Terms</div>
        <div class="board" style="grid-template-columns: 1fr; margin-bottom:0;" id="terms-list"></div>
      </div>
      <div>
        <div class="col-label">Definitions</div>
        <div class="board" style="grid-template-columns: 1fr; margin-bottom:0;" id="defs-list"></div>
      </div>
    </div>
  </div>
  <div class="score-screen" id="score-screen">
    <div class="score-circle" id="score-circle"></div>
    <div class="score-title" id="score-title"></div>
    <div class="score-sub" id="score-sub"></div>
    <div class="score-breakdown" id="score-breakdown"></div>
    <button class="retry-btn" onclick="restart()">Shuffle & try again</button>
  </div>
</div>

<script>
const pairs = [
  {
    id: 0,
    term: "Recruiting Violations",
    def: "Documents, merges, and resolves recruiting-related violations flagged in the system."
  },
  {
    id: 1,
    term: "Recruit Filters and Fields",
    def: "Determines how recruits are categorized, filtered, and reported on across the department and each sport."
  },
  {
    id: 2,
    term: "Recruiting Activity Tab",
    def: "Gives compliance staff a centralized view of every logged recruiting interaction, contact, and comment."
  },
  {
    id: 3,
    term: "Sports Settings",
    def: "Turns on ticketing for a sport and sets guest approval requirements and ticket limits."
  },
  {
    id: 4,
    term: "Guest-Specific Questions",
    def: "Asked once per guest whenever a ticket request is made for them."
  },
  {
    id: 5,
    term: "Generate Guest List",
    def: "Produces a printable PDF pass list for an event once tickets are reviewed and approved."
  }
];

let selectedTerm = null, selectedDef = null;
let matched = new Set();
let mistakes = 0;
let termOrder = [], defOrder = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  termOrder = shuffle(pairs.map(p => p.id));
  defOrder = shuffle(pairs.map(p => p.id));
  renderColumn('terms-list', termOrder, 'term', selectTerm);
  renderColumn('defs-list', defOrder, 'def', selectDef);
  updateProgress();
}

function renderColumn(containerId, order, field, handler) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  order.forEach(id => {
    const pair = pairs.find(p => p.id === id);
    const btn = document.createElement('button');
    btn.className = 'card' + (field === 'term' ? ' term-card' : '') + (matched.has(id) ? ' matched' : '');
    btn.textContent = pair[field];
    btn.disabled = matched.has(id);
    btn.dataset.id = id;
    btn.onclick = () => handler(id, btn);
    el.appendChild(btn);
  });
}

function selectTerm(id, btn) {
  if (matched.has(id)) return;
  clearSelectionClass('terms-list');
  selectedTerm = id;
  btn.classList.add('selected');
  if (selectedDef !== null) checkMatch();
}

function selectDef(id, btn) {
  if (matched.has(id)) return;
  clearSelectionClass('defs-list');
  selectedDef = id;
  btn.classList.add('selected');
  if (selectedTerm !== null) checkMatch();
}

function clearSelectionClass(containerId) {
  document.querySelectorAll(`#${containerId} .card`).forEach(c => c.classList.remove('selected'));
}

function checkMatch() {
  const termBtn = document.querySelector(`#terms-list .card[data-id="${selectedTerm}"]`);
  const defBtn = document.querySelector(`#defs-list .card[data-id="${selectedDef}"]`);
  if (selectedTerm === selectedDef) {
    matched.add(selectedTerm);
    termBtn.classList.remove('selected');
    defBtn.classList.remove('selected');
    termBtn.classList.add('matched');
    defBtn.classList.add('matched');
    termBtn.disabled = true;
    defBtn.disabled = true;
    selectedTerm = null; selectedDef = null;
    updateProgress();
    if (matched.size === pairs.length) setTimeout(showComplete, 400);
  } else {
    mistakes++;
    document.getElementById('mistakes-counter').textContent = `Mistakes: ${mistakes}`;
    termBtn.classList.add('wrong');
    defBtn.classList.add('wrong');
    setTimeout(() => {
      termBtn.classList.remove('wrong', 'selected');
      defBtn.classList.remove('wrong', 'selected');
      selectedTerm = null; selectedDef = null;
    }, 500);
  }
}

function updateProgress() {
  document.getElementById('header-counter').textContent = `${matched.size} of ${pairs.length} matched`;
  document.getElementById('progress-bar').style.width = `${(matched.size / pairs.length) * 100}%`;
}

function showComplete() {
  document.getElementById('game-area').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';
  document.getElementById('score-circle').innerHTML = `${pairs.length}/${pairs.length}`;
  document.getElementById('score-title').textContent = mistakes === 0 ? 'Perfect match!' : mistakes <= 2 ? 'Nice work!' : 'All matched!';
  document.getElementById('score-sub').textContent = `You matched all ${pairs.length} pairs with ${mistakes} mistake${mistakes === 1 ? '' : 's'}.`;
  document.getElementById('score-breakdown').innerHTML = pairs.map(p =>
    `<div class="breakdown-row"><span class="breakdown-term">✅ ${p.term}</span><span class="breakdown-def">${p.def}</span></div>`
  ).join('');
}

function restart() {
  selectedTerm = null; selectedDef = null; matched = new Set(); mistakes = 0;
  document.getElementById('mistakes-counter').textContent = 'Mistakes: 0';
  document.getElementById('game-area').style.display = 'block';
  document.getElementById('score-screen').style.display = 'none';
  render();
}

render();
</script>
</body>
</html>
